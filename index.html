<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Archive — A vintage-inspired creative portfolio showcasing artistry, design, and innovation." />
    <meta name="theme-color" content="#211B18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Archive — Creative Portfolio" />
    <meta property="og:description" content="A vintage-inspired creative portfolio showcasing artistry, design, and innovation." />
    <meta property="og:image" content="/images/vintage-background.jpg" />

    <title>The Archive — Creative Portfolio</title>

    <!-- Prevent theme flash: apply saved or system-preferred theme before React loads -->
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved || (prefersDark ? "dark" : "dark");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
